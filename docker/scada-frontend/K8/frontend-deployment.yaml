apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-frontend
  namespace: scada
  labels:
    app: scada-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scada-frontend
  template:
    metadata:
      labels:
        app: scada-frontend
    spec:
      containers:
        - name: scada-frontend
          image: elashrypublic/scada-frontend:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
